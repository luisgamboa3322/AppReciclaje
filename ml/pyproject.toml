[project]
name = "pecox-ml"
version = "0.1.0"
description = "PECOX Vision ML training, evaluation, and inference pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pillow>=11.0,<12.0",
    "scikit-learn>=1.6,<2.0",
    "torch>=2.5,<3.0",
    "torchvision>=0.20,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
